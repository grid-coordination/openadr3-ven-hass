get_forecast:
  name: Get forecast
  description: >-
    Return the full forecast for an OpenADR 3 sensor at the VTN's native
    interval granularity. Use this instead of reading entity attributes for
    forecast data — forecasts are no longer exposed via extra_state_attributes
    because they can exceed Home Assistant's 16 KB recorder limit at
    sub-hourly resolutions.
  target:
    entity:
      integration: openadr3_ven
      domain: sensor
  fields:
    start:
      name: Start
      description: >-
        Earliest interval start time to include (inclusive). Defaults to
        returning all available rows.
      example: "2026-05-25T00:00:00+10:00"
      selector:
        datetime:
    end:
      name: End
      description: >-
        Latest interval start time to include (exclusive). Defaults to
        returning all available rows.
      example: "2026-06-01T00:00:00+10:00"
      selector:
        datetime:
